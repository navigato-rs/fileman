name: Release

on:
  push:
    tags:
      - "v*"

env:
  NAVIGATO_PRIVATE_REPORT_EMAIL: ${{ secrets.NAVIGATO_PRIVATE_REPORT_EMAIL }}

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            variant: vulkan
            rustflags: ""
            suffix: ""
          - os: ubuntu-latest
            variant: gles
            rustflags: "--cfg gles"
            suffix: "-gles"
          - os: windows-latest
            variant: default
            rustflags: ""
            suffix: ""
          - os: macos-latest
            variant: default
            rustflags: ""
            suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # --- Linux ---
      - name: Install packaging tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-bundle --git https://github.com/burtonageo/cargo-bundle --rev 17cc8eb --locked
          cargo install cargo-deb cargo-generate-rpm

      - name: Build + bundle with self-update (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo bundle --release --features self-update
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Package tarball (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          tar -C target/release -czf dist/fileman-linux-x86_64${{ matrix.suffix }}.tar.gz fileman

      - name: Package AppImage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          cp target/release/bundle/appimage/fileman_*_x86_64.AppImage dist/fileman-linux-x86_64${{ matrix.suffix }}.AppImage

      - name: Rebuild without self-update for packages (Linux Vulkan)
        if: matrix.os == 'ubuntu-latest' && matrix.variant == 'vulkan'
        run: cargo build --release --bin fileman

      - name: Package deb + rpm (Linux Vulkan)
        if: matrix.os == 'ubuntu-latest' && matrix.variant == 'vulkan'
        run: |
          cargo deb --no-build
          cp target/debian/*.deb dist/
          cargo generate-rpm
          cp target/generate-rpm/*.rpm dist/

      # --- macOS ---
      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cargo install cargo-bundle --git https://github.com/burtonageo/cargo-bundle --rev 17cc8eb --locked
          rustup target add aarch64-apple-darwin
          cargo bundle --release --target aarch64-apple-darwin --features self-update

      # Signs with Developer ID, notarizes, and staples when the secrets below
      # are configured; falls back to an ad-hoc signature otherwise so the job
      # still produces artifacts on forks. See CONTRIBUTING.md for the setup.
      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: scripts/macos_package.sh
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

      # --- Windows ---
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: cargo build --release --bin fileman --features self-update

      - name: Package zip (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/fileman.exe -DestinationPath dist/fileman-windows-x86_64.zip

      - name: Add WiX to PATH (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH (Join-Path $env:WIX 'bin')

      - name: Package MSI (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo install cargo-wix --version '^0.3' --locked
          # Build the MSI from the committed wix/main.wxs. Do NOT run
          # `cargo wix init --force`, which regenerates main.wxs from the stock
          # template and discards the checked-in Start-Menu shortcut, ARP icon,
          # and dialog customizations.
          cargo wix --no-build --nocapture
          Copy-Item target/wix/*.msi dist/

      # --- Upload ---
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
