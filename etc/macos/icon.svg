<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Full-bleed Liquid Glass. macOS applies the squircle. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ec4e6"/>
      <stop offset="1" stop-color="#162844"/>
    </linearGradient>
    <radialGradient id="pool" cx="50%" cy="8%" r="58%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.1" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#78a0be" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4e4ff"/>
      <stop offset="1" stop-color="#006ee0"/>
    </linearGradient>
    <linearGradient id="row" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <rect width="256" height="256" fill="url(#pool)"/>
  <rect width="256" height="46" fill="url(#lip)"/>
  <rect x="16" y="32" width="108" height="192" rx="28" fill="url(#frost)" stroke="#fff" stroke-opacity="0.8" stroke-width="2"/>
    <rect x="132" y="32" width="108" height="192" rx="28" fill="url(#frost)" stroke="#fff" stroke-opacity="0.8" stroke-width="2"/>
  <rect x="124" y="32" width="8" height="192" rx="4" fill="#fff" opacity="0.42"/>
  <rect x="20" y="44" width="96" height="30" rx="15" fill="#64c2ff" opacity="0.7" filter="url(#glow)"/>
      
<rect x="28" y="52" width="80" height="14" rx="7" fill="url(#mark)"/>    <rect x="28" y="76" width="58" height="10" rx="5" fill="url(#row)"/>    <rect x="148" y="52" width="80" height="10" rx="5" fill="url(#row)"/>    <rect x="148" y="70" width="66" height="10" rx="5" fill="url(#row)"/>
</svg>
