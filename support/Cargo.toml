[package]
name = "navigato-support"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Content-free, local diagnostics and feedback for Navigato applications"
repository = "https://github.com/navigato-rs/fileman"

[dependencies]
egui = { version = "0.34", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
